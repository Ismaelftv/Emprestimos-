services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: caixa, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: caixa }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U caixa"], interval: 10s, retries: 5 }
  api:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://caixa:${POSTGRES_PASSWORD}@db:5432/caixa
      TRUST_PROXY: "true"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@gmail.com}"
    volumes: [files:/data]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
volumes: { pgdata: {}, files: {}, caddy_data: {}, caddy_config: {} }
